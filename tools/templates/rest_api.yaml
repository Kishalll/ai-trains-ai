# REST API Tool Definition
tools:
  - name: check_service_status
    type: api
    description: "Check external service operational status and schedules"
    url: "https://api.example.com/services/status"
    method: GET
    parameters:
      - name: service_id
        type: string
        required: false
        description: "Service name or identifier"
    response_template: |
      {% if response.services %}
      Service Status & Timings:
      {% for item in response.services %}
      - {{item.name}}: Status {{item.status}} (Next window: {{item.window}})
      {% endfor %}
      {% else %}
      No active service status returned.
      {% endif %}
