# REST API Tool Definition
tools:
  - name: check_bus_schedule
    type: api
    description: "Check campus shuttle bus timings and routes"
    url: "https://api.campus.edu/transport/shuttle"
    method: GET
    parameters:
      - name: route
        type: string
        required: false
        description: "Bus route name or stop name"
    response_template: |
      {% if response.schedules %}
      Campus Shuttle Timings:
      {% for item in response.schedules %}
      - Route {{item.route}}: Departs {{item.departure}} from {{item.origin}} -> Arrives {{item.arrival}} at {{item.destination}}
      {% endfor %}
      {% else %}
      No active bus schedule returned for route.
      {% endif %}
